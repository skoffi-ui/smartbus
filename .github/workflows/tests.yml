name: 🧪 Tests SMARTBUS

# Déclenché sur les push et les PR vers main, develop, feat/refonte-v2 et feat/*.
# Les jobs ne dépendent pas les uns des autres : un échec de lint ne masque
# plus les tests ni les builds.
on:
  push:
    branches:
      - main
      - develop
      - feat/refonte-v2
      - feat/**
  pull_request:
    branches:
      - main
      - develop
      - feat/refonte-v2
      - feat/**

# Les actions checkout v4, setup-node v4, upload-artifact v4 et codecov v4
# tournent sur Node 20, retiré des runners GitHub le 2026-09-23. On reste sur
# des majeures Node 24. L'application elle-même reste sur Node 20.
jobs:
  lint:
    name: 🔍 Linting
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 ESLint backend (sans --fix)
        run: npm run lint

      - name: 📦 Install school-web
        working-directory: apps/school-web
        run: npm ci

      - name: 🔍 oxlint school-web
        working-directory: apps/school-web
        run: npm run lint

      - name: 📦 Install super-admin-web
        working-directory: apps/super-admin-web
        run: npm ci

      - name: 🔍 oxlint super-admin-web
        working-directory: apps/super-admin-web
        run: npm run lint

  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run unit tests with coverage
        run: npm run test:ci

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unit
          name: unit-tests
          fail_ci_if_error: false

  e2e-tests:
    name: 🚀 E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartbus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      SUPER_DB_HOST: localhost
      SUPER_DB_PORT: 5432
      SUPER_DB_NAME: smartbus_test
      SUPER_DB_USER: postgres
      SUPER_DB_PASSWORD: postgres
      SCHOOL_TENANT_DB_NAME: smartbus_school_test
      JWT_SECRET: 0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: fedcba9876543210fedcba9876543210
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Run E2E tests
        run: mkdir -p test-results && npm run test:e2e -- --json --outputFile=test-results/e2e-results.json

      - name: 📤 Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore

  build:
    name: 🏗️ Build backend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build par défaut (hors parent-app)
        run: npm run build

      - name: 🏗️ Build super-app
        run: npm run build super-app

      - name: 🏗️ Build school-app
        run: npm run build school-app

      - name: 🏗️ Build api-gateway
        run: npm run build api-gateway

  front-builds:
    name: 🏗️ Build fronts web
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 🏗️ school-web
        working-directory: apps/school-web
        run: npm ci && npm run lint && npm run build

      - name: 🏗️ super-admin-web
        working-directory: apps/super-admin-web
        run: npm ci && npm run lint && npm run build
